[package]
name = "libp2p-noise"
edition.workspace = true
rust-version = { workspace = true }
description = "Cryptographic handshake protocol using the noise framework."
version = "0.47.0"
authors = ["Parity Technologies <admin@parity.io>"]
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"

[features]
# Hybrid PQ handshake, off by default. use-curve25519 satisfies snow's
# default-resolver guard (the ML-KEM impl lives there).
mlkem-hfs = ["snow/use-ml-kem", "snow/use-curve25519"]

[dependencies]
asynchronous-codec = { workspace = true }
bytes.workspace = true
futures = { workspace = true }
libp2p-core = { workspace = true }
libp2p-identity = { workspace = true, features = ["ed25519"] }
multiaddr = { workspace = true }
multihash = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
static_assertions = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
x25519-dalek = "2"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
snow = { version = "0.10", features = ["ring-resolver"], default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
snow = { version = "0.10", features = ["default-resolver"], default-features = false }

[dev-dependencies]
futures_ringbuf = "0.4.0"
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libp2p-identity = { workspace = true, features = ["rand"] }
criterion = { workspace = true }
hex-literal = { workspace = true }
# Snow exposed as a dev-dep so integration tests can build seeded resolvers
# for deterministic vector generation without touching src/.
# Needs use-chacha20poly1305 + use-sha2 so DefaultResolver can handle the full
# Noise_XXhfs_25519+ML-KEM-768_ChaChaPoly_SHA256 parameter string.
snow = { version = "0.10", features = ["default-resolver", "use-ml-kem", "use-curve25519", "use-chacha20poly1305", "use-sha2"], default-features = false }

[[bench]]
name = "noise_hfs"
harness = false
required-features = ["mlkem-hfs"]

[[example]]
name = "noise_hfs_listener"
required-features = ["mlkem-hfs"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
